name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Java 17 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: SDK bileşenlerini kur
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bağımlılıkları yükle
        run: npm install --no-audit --no-fund

      - name: Sözlüğü göm
        run: node scripts/embed-dictionary.js

      - name: Android projesini oluştur
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Sürüm ve imza ayarlarını uygula
        run: |
          VC=$(grep '^versionCode=' version.properties | cut -d= -f2)
          VN=$(grep '^versionName=' version.properties | cut -d= -f2)
          sed -i "s/versionCode 1/versionCode $VC/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('../../keystore/release.p12')
                      storeType 'PKCS12'
                      storePassword 'sozluk2026'
                      keyAlias 'sozlukkey'
                      keyPassword 'sozluk2026'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: APK derle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: İmzayı doğrula
        run: |
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          "$SDK/build-tools/34.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v6
        with:
          name: farsca-turkce-sozluk-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
